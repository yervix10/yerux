[package]
name = "yerux"
version = "1.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT OR Apache-2.0"

[dependencies]
semver = { version = "1.0", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
toml_edit = { version = "0.22", features = ["serde"] }

[profile.release]
opt-level = 3
