name: Bug report
description: The compiler, the standard library or a tool does not do what the documentation says
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. A short, self-contained program plus the two outputs (expected and obtained)
        is the fastest route to a fix. The version, the platform and the backend matter here: the two
        backends are separate code generators and one of them may be wrong on its own.
  - type: textarea
    id: version
    attributes:
      label: Yerux version
      description: The first line of `yerux --version`. Say also whether you installed a release (install.sh) or built from source (cargo build --release).
      render: text
      placeholder: "yerux 1.0.0 (release, install.sh)"
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system and architecture
      placeholder: "Debian 13, x86-64 / Ubuntu 24.04 arm64"
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Backend
      description: The C backend is the default; `--native` is the built-in code generator. Choose "both" when the two backends disagree or the bug is in the front end.
      options:
        - C backend (default, no flag)
        - Native backend (--native)
        - Both show it the same way
        - Only one of them shows it (the backends disagree)
    validations:
      required: true
  - type: textarea
    id: program
    attributes:
      label: Minimal program that reproduces it
      description: A complete `.yx` file with `fn main()`, as small as you can make it. Paste the text, not a screenshot.
      render: text
      placeholder: |
        fn main() {
          print(1 + 1)
        }
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: The command you ran
      placeholder: "yerux run prog.yx --native"
  - type: textarea
    id: expected
    attributes:
      label: Expected output
      description: What should have happened, and with which exit code (and why you expected it — a page of the guide or a test name helps).
      render: text
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Output you got
      description: The exact output, including exit code, compiler diagnostics, `panic:` lines and (if any) a backtrace from `YERUX_BACKTRACE=1`.
      render: text
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Did it work in an earlier version? Does it depend on a platform or on a `--target`? Paste `yerux doctor` when the installation is in doubt.
      render: text
