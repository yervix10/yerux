name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fast:
    # quick check on pull requests: build without warnings, unit tests, representative subset of the suite
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
          restore-keys: cargo-${{ runner.os }}-
      - run: tests/ci.sh --fast
  full:
    # full suite on every push to main
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Install AArch64 test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user libc6-arm64-cross
          echo "QEMU_LD_PREFIX=/usr/aarch64-linux-gnu" >> "$GITHUB_ENV"
      - run: tests/ci.sh
  release-check:
    # the release tarball builds, installs into a throwaway HOME and `yerux doctor` passes
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: scripts/release.sh dist
      - run: |
          (cd dist && sha256sum -c ./*.sha256)
          export HOME="$(mktemp -d)"
          tar -xzf dist/yerux-*.tar.gz -C "$HOME"
          "$HOME"/yerux-*/install.sh
          "$HOME/.local/bin/yerux" doctor
  windows-check:
    # the compiler must keep compiling for Windows (no Windows-only code is run here)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add x86_64-pc-windows-gnu
      - run: cargo check --tests --target x86_64-pc-windows-gnu
  windows:
    # Windows host: build, doctor, the native backend (PE executables) on examples and the fast list,
    # and the C backend through the MinGW gcc that the runner image ships (informational)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: build (no warnings)
        run: |
          touch src/main.rs
          cargo build --release 2>&1 | tee build.log
          ! grep -q '^warning' build.log
      - name: doctor
        run: target/release/yerux.exe doctor
      - name: native smoke suite (examples + fast list)
        run: bash tests/win_smoke.sh
      - name: unit tests (informational until proven on Windows)
        continue-on-error: true
        run: cargo test -q
      - name: C backend with MinGW gcc (informational)
        continue-on-error: true
        run: |
          export YERUX_CC=gcc
          target/release/yerux.exe run examples/01_lists.yx
